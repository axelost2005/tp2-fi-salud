# Base de datos PostgreSQL para desarrollo local.
# Uso: docker compose up -d db  →  luego `pnpm dev` en la raíz del proyecto.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: salud
      POSTGRES_PASSWORD: salud
      POSTGRES_DB: tp2_salud
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
